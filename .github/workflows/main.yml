name: build
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build with Maven
        run: mvn -B -q package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelmonRentalMarket
          path: target/*.jar
